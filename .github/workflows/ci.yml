name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Ensure headless Chrome for browser E2E
        run: command -v google-chrome || npx --yes playwright-core install --with-deps chromium

      - name: Workspace syntax & shim check
        run: npm run check

      - name: Unit, integration & browser E2E regression tests
        run: npm test

      - name: Seed & validate monitor data (v1 + v2 parity)
        run: npm run monitor:seed-v2 && npm run monitor:validate

      - name: Build Cloudflare assets
        run: npm run build:cloudflare

      - name: Build VPS immutable assets
        run: npm run build:vps

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
