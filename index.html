<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResNode Radar · VPS 与住宅家宽实时库存雷达终端</title>
    <meta
      name="description"
      content="基于公开官方页面的 VPS 与住宅家宽（ISP）节点库存监控、回程线路甄别、原币种账单与 ECB 汇率参考折算及补货变盘雷达工作台。"
    />
    <link rel="canonical" href="https://majiayu000.github.io/resnode-radar/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ResNode Radar" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="ResNode Radar · VPS 与住宅家宽实时库存雷达终端" />
    <meta
      property="og:description"
      content="高信噪比 VPS / 真家宽（双 ISP）库存监控、解析证据链审计、变盘雷达与多方案横向对比工作台。"
    />
    <meta property="og:url" content="https://majiayu000.github.io/resnode-radar/" />
    <meta property="og:image" content="https://majiayu000.github.io/resnode-radar/assets/inventory-preview.png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem("resnode-radar:theme:v4");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch {}
    </script>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-workspace">跳至主工作区</a>

    <div class="app-shell" data-app-root>
      <header class="cmd-header" data-app-header>
        <div class="cmd-bar">
          <a class="brand-link" href="./">
            <img class="brand-logo" src="favicon.svg" alt="" width="24" height="24" />
            <span class="brand-name">
              <span>ResNode Radar</span>
              <span class="brand-chip">TERMINAL</span>
            </span>
          </a>
        </div>
        <div class="telemetry-strip">
          <div class="telemetry-inner">
            <span class="tele-pill"><span class="status-dot"></span><span data-telemetry-label>同步快照中…</span></span>
          </div>
        </div>
      </header>

      <div class="status-banner-wrap" data-app-banner hidden></div>

      <main class="app-main" id="main-workspace" tabindex="-1">
        <section data-view-panel="terminal" aria-label="选机终端"></section>
        <section data-view-panel="radar" aria-label="市场异动雷达" hidden></section>
        <section data-view-panel="providers" aria-label="商家目录与监控源健康" hidden></section>
        <section data-view-panel="guide" aria-label="核验口径与避坑手册" hidden></section>
      </main>

      <footer class="site-footer">
        <div class="site-footer-inner">
          <div>
            <strong>ResNode Radar</strong> · 仅展示公开官方页面监控快照与显式诊断状态，绝不编造模拟库存、假跑分或隐性返利链接。
          </div>
          <div class="footer-links">
            <a href="reviews/aaitr.html">AaITR 实测档案</a>
            <a href="reviews/lisahost.html">LisaHost 实测档案</a>
            <a href="https://github.com/majiayu000/resnode-radar" target="_blank" rel="noopener noreferrer">GitHub 源码 ↗</a>
          </div>
        </div>
      </footer>
    </div>

    <div class="sheet-backdrop" data-sheet-backdrop hidden></div>
    <div class="compare-dock" data-compare-dock hidden></div>
    <div class="modal-backdrop" data-compare-modal hidden></div>
    <div class="drawer-backdrop" data-inspector-backdrop hidden></div>
    <div class="drawer-backdrop" data-saved-backdrop hidden></div>
    <div class="palette-backdrop" data-palette-backdrop hidden></div>
    <div class="toast-region" data-toast-region aria-live="polite"></div>

    <noscript>
      <div style="max-width:720px;margin:32px auto;padding:18px;border:1px solid #dce1ea;border-radius:8px;background:#fff;color:#0f172a">
        请启用 JavaScript 以加载实时监控快照 <code>data/products.json</code>。
      </div>
    </noscript>

    <script type="module" src="src/bootstrap.js"></script>
  </body>
</html>
