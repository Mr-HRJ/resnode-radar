server {
    listen 80;
    listen [::]:80;
    server_name vpsld.com www.vpsld.com vps.bnoai.com vps-direct.bnoai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/resnode-radar/acme;
        add_header Cache-Control "no-store";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vpsld.com www.vpsld.com vps.bnoai.com vps-direct.bnoai.com;
    root /opt/resnode-radar/current/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vps.bnoai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.bnoai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ResNodeTLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/resnode-radar-access.log;
    error_log /var/log/nginx/resnode-radar-error.log;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_static on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Cloudflare may redirect HTTP certificate challenges to HTTPS first.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/resnode-radar/acme;
        add_header Cache-Control "no-store";
    }

    # Block hidden files, journal, locks, quarantine dirs, and SQLite databases anywhere under /data/
    location ~* ^/data/(?:.*\.(?:sqlite|sqlite-wal|sqlite-shm|lock)|v2/journal\.json|.*/\.|.*\.quarantine) {
        return 404;
    }

    location = /api/v1/pulse {
        client_max_body_size 1k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_pass http://127.0.0.1:18920;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET HEAD { deny all; }
    }

    location = /api/v1/stats {
        client_max_body_size 1k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_pass http://127.0.0.1:18920;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET POST { deny all; }
    }

    location = /api/stats {
        client_max_body_size 1k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_pass http://127.0.0.1:18920;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET POST { deny all; }
    }

    location = /data/v2/latest.json {
        alias /var/lib/resnode-radar/data/v2/latest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=0, s-maxage=30, must-revalidate";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=30, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET HEAD { deny all; }
    }

    location ^~ /data/snapshots/ {
        alias /var/lib/resnode-radar/data/snapshots/;
        default_type application/json;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET HEAD { deny all; }
    }

    location = /data/products.json {
        alias /var/lib/resnode-radar/data/products.json;
        default_type application/json;
        gzip_static off;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=60, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET HEAD { deny all; }
    }

    location ^~ /static/ {
        alias /var/lib/resnode-radar/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET HEAD { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=60, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET HEAD { deny all; }
    }
}
