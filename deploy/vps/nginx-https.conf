server {
    listen 80;
    listen [::]:80;
    server_name vps.bnoai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/resnode-radar/acme;
    }

    location / {
        return 301 https://vps.bnoai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vps.bnoai.com;
    root /opt/resnode-radar/current/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vps.bnoai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.bnoai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ResNodeTLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/resnode-radar-access.log;
    error_log /var/log/nginx/resnode-radar-error.log;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    location = /data/products.json {
        alias /var/lib/resnode-radar/data/products.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
}
