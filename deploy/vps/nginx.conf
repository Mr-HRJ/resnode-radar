server {
    listen 80;
    listen [::]:80;
    server_name vpsld.com www.vpsld.com vps.bnoai.com vps-direct.bnoai.com;
    root /opt/resnode-radar/current/dist;
    index index.html;

    access_log /var/log/nginx/resnode-radar-access.log;
    error_log /var/log/nginx/resnode-radar-error.log;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/resnode-radar/acme;
    }

    location = /data/products.json {
        alias /var/lib/resnode-radar/data/products.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
}
